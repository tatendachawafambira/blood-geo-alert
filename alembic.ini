[alembic]
script_location = alembic

# Puts src/ on sys.path so env.py can import bga.config and bga.db without an
# editable install. Editable install is still recommended for pytest/uvicorn.
prepend_sys_path = src

# Readable, sortable migration filenames: 20260811_1430-ab12cd34_message.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# No sqlalchemy.url here on purpose. env.py takes it from
# settings.database_url_owner so the connection string lives in .env only,
# and .env is not tracked by git.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
